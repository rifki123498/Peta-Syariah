name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Local secrets for e2e
        run: printf 'XENDIT_CALLBACK_TOKEN=test-callback\nADMIN_TOKEN=test-admin\n' > .dev.vars
      - run: npm run test:e2e
        env:
          CI: "1"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Stop if Cloudflare is not configured yet
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.skip != '1'
        run: npm ci
      - if: steps.cf.outputs.skip != '1'
        name: Build
        run: npm run build
        env:
          VITE_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          VITE_PRICE_ARMS: ${{ vars.PRICE_ARMS || '89000' }}
          VITE_PRICE_ANCHOR: ${{ vars.PRICE_ANCHOR || '149000' }}
      - if: steps.cf.outputs.skip != '1'
        name: Ensure D1 database
        run: node scripts/ensure-d1.mjs
      - if: steps.cf.outputs.skip != '1'
        name: Apply migrations
        run: npx wrangler d1 migrations apply peta-syariah-db --remote
      - if: steps.cf.outputs.skip != '1'
        name: Deploy Worker
        run: |
          npx wrangler deploy \
            --var PRICE_ARMS:"${{ vars.PRICE_ARMS || '89000' }}" \
            --var META_PIXEL_ID:"${{ vars.META_PIXEL_ID }}" \
            --var PUBLIC_BASE_URL:"${{ vars.PUBLIC_BASE_URL }}" \
            --var DOKU_ENV:"${{ vars.DOKU_ENV || 'sandbox' }}" \
            --var MAIL_FROM:"${{ vars.MAIL_FROM }}"
      - if: steps.cf.outputs.skip != '1'
        name: Redirect old address
        run: npx wrangler deploy --config redirect/wrangler.toml
      - if: steps.cf.outputs.skip != '1'
        name: Sync secrets
        env:
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.DOKU_SECRET_KEY }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_CALLBACK_TOKEN: ${{ secrets.XENDIT_CALLBACK_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for k in META_CAPI_TOKEN DOKU_CLIENT_ID DOKU_SECRET_KEY XENDIT_SECRET_KEY XENDIT_CALLBACK_TOKEN ADMIN_TOKEN RESEND_API_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$k"; fi
          done
